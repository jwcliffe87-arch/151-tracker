<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>151 Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0d0d">
<link rel="manifest" href="manifest.json">

<style>
* { box-sizing:border-box; }

body {
  font-family:Arial,sans-serif;
  background:#0d0d0d;
  color:white;
  margin:0;
  min-height:100vh;
}

body.loading { overflow:hidden; }

/* SPLASH */
#splash {
  position:fixed;
  inset:0;
  background:#050505;
  z-index:5000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px;
  transition:opacity .45s ease, visibility .45s ease;
}

#splash.hide {
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

#splashImage {
  width:min(88vw,420px);
  max-height:58vh;
  object-fit:contain;
  border-radius:18px;
  display:block;
  box-shadow:0 0 35px rgba(255,255,255,.08);
}

#splashFallback {
  display:none;
  width:150px;
  height:150px;
  border-radius:30px;
  align-items:center;
  justify-content:center;
  font-size:70px;
  background:#1a1a1a;
  box-shadow:0 0 30px rgba(255,255,255,.08);
}

#loadingText {
  margin-top:22px;
  min-height:20px;
  color:#ccc;
  font-size:14px;
  text-align:center;
}

#loadingTrack {
  width:min(78vw,330px);
  height:8px;
  margin-top:12px;
  background:#292929;
  border-radius:99px;
  overflow:hidden;
}

#loadingFill {
  width:4%;
  height:100%;
  background:#fff;
  border-radius:99px;
  transition:width .35s ease;
}

#loadingSub {
  margin-top:9px;
  color:#777;
  font-size:11px;
}

#retryLoad {
  display:none;
  margin-top:16px;
  padding:9px 16px;
  border:0;
  border-radius:8px;
  background:#444;
  color:white;
}

/* APP */
.header {
  padding:8px;
  text-align:center;
  position:relative;
}

#logo {
  width:100%;
  max-width:300px;
  margin:0 auto 10px auto;
  display:block;
}

.bar {
  height:10px;
  background:#333;
  border-radius:6px;
  overflow:hidden;
}

.fill {
  height:100%;
  width:0%;
  transition:width .3s ease;
}

.tabs {
  display:flex;
  gap:5px;
  padding:6px;
}

.tabs button {
  flex:1;
  padding:8px 4px;
  border:none;
  border-radius:6px;
  background:#333;
  color:white;
  transition:transform .12s ease, box-shadow .2s ease;
}

.tabs button:active,
#filterButtons button:active,
button.card-btn:active {
  transform:scale(.97);
}

.tabs button.active { box-shadow:0 0 10px currentColor; }

#tab-normal.active { background:#fff; color:#000; }
#tab-poke.active { background:#e53935; }
#tab-master.active { background:#8e24aa; }
#tab-extra.active { background:#1e88e5; }

#filterButtons {
  display:flex;
  gap:6px;
  padding:0 6px;
}

#wishlistToggle,
#inPostToggle {
  flex:1;
  padding:8px 4px;
  border:none;
  border-radius:6px;
  background:#444;
  color:white;
  transition:transform .12s ease, box-shadow .2s ease, background .2s ease;
}

.grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  padding:6px;
  padding-bottom:60px;
}

.card {
  background:#1a1a1a;
  border-radius:10px;
  padding:6px;
  text-align:center;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  min-width:0;
}

.card-title {
  height:48px;
  font-size:14px;
  overflow:hidden;
}

.card img {
  width:100%;
  height:140px;
  object-fit:contain;
  background:#080808;
  border-radius:6px;
  display:block;
  cursor:pointer;
}

.card img.loading {
  background:linear-gradient(90deg,#111 25%,#202020 50%,#111 75%);
  background-size:200% 100%;
  animation:shimmer 1.2s infinite;
}

.card img.failed {
  object-fit:contain;
  opacity:.7;
}

@keyframes shimmer {
  to { background-position:-200% 0; }
}

button.card-btn {
  margin-top:4px;
  width:100%;
  padding:7px 6px;
  border:none;
  border-radius:6px;
  transition:transform .12s ease, filter .15s ease;
}

button.card-btn:hover { filter:brightness(1.08); }

.reset-icon {
  position:absolute;
  top:10px;
  right:10px;
  background:#222;
  color:white;
  border:0;
  border-radius:50%;
  width:36px;
  height:36px;
  font-size:18px;
}

#backTop {
  position:fixed;
  bottom:70px;
  right:20px;
  width:50px;
  height:50px;
  border:none;
  border-radius:50%;
  background:#333;
  color:white;
  font-size:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
  opacity:.8;
}

#statsBar {
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:#111;
  color:#ccc;
  font-size:13px;
  text-align:center;
  padding:8px 0;
  z-index:998;
  border-top:2px solid #333;
}

/* RESET MODAL */
#resetModal {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  z-index:3000;
  justify-content:center;
  align-items:center;
}

#resetModal .box {
  background:#1a1a1a;
  padding:20px;
  border-radius:12px;
  width:80%;
  max-width:300px;
  text-align:center;
}

#resetModal .actions {
  display:flex;
  gap:10px;
}

#resetModal button {
  flex:1;
  padding:8px;
  border:none;
  border-radius:6px;
}

.cancel { background:#444; color:white; }
.confirm { background:#e53935; color:white; }

/* CARD OVERLAY */
#overlay {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.96);
  justify-content:center;
  align-items:center;
  z-index:4000;
  touch-action:pan-y;
}

#overlayImg {
  width:95%;
  max-height:88%;
  object-fit:contain;
  border-radius:8px;
}

#ebayBtn {
  position:absolute;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  padding:10px 16px;
  border:none;
  border-radius:8px;
  background:#333;
  color:white;
  font-size:14px;
  z-index:4001;
  display:none;
}

#overlayHint {
  position:absolute;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  color:#777;
  font-size:11px;
  pointer-events:none;
}

#loadError {
  display:none;
  margin:12px 6px;
  padding:14px;
  background:#1a1a1a;
  border-radius:10px;
  text-align:center;
  color:#ccc;
}

#loadError button {
  margin-top:10px;
  padding:8px 14px;
  border:0;
  border-radius:7px;
  background:#444;
  color:white;
}
</style>
</head>

<body class="loading">

<!-- SPLASH -->
<div id="splash">
  <img src="splash.png" id="splashImage" alt="151 Tracker loading">
  <div id="splashFallback">🃏</div>
  <div id="loadingText">Starting 151 Tracker...</div>
  <div id="loadingTrack"><div id="loadingFill"></div></div>
  <div id="loadingSub">Preparing your collection</div>
  <button id="retryLoad" onclick="startLoading(true)">Retry</button>
</div>

<div class="header">
  <img src="logo.png" id="logo" alt="151 Tracker">
  <div id="totalText"></div>
  <div id="progress"></div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <button class="reset-icon" onclick="openResetModal()" aria-label="Settings">⚙️</button>
</div>

<div class="tabs">
  <button id="tab-normal" onclick="setView('normal')">Normal</button>
  <button id="tab-poke" onclick="setView('poke')">Pokéball</button>
  <button id="tab-master" onclick="setView('master')">Masterball</button>
  <button id="tab-extra" onclick="setView('extra')">Extras</button>
</div>

<div id="filterButtons">
  <button id="wishlistToggle" onclick="toggleWishlist()">Show Wishlist</button>
  <button id="inPostToggle" onclick="toggleInPost()">Show In Post</button>
</div>

<div id="loadError">
  Couldn't load the card list.
  <br>
  Your saved collection is safe.
  <br>
  <button onclick="startLoading(true)">Try Again</button>
</div>

<div class="grid" id="grid"></div>

<button id="backTop" onclick="scrollToTop()">↑</button>

<div id="statsBar">
  <span id="statsText"></span>
</div>

<!-- RESET -->
<div id="resetModal">
  <div class="box">
    <div style="font-size:18px;margin-bottom:10px;">⚙️ Reset Progress</div>
    <div style="font-size:14px;color:#ccc;margin-bottom:20px;">
      This will clear your entire collection.<br><br>
      This cannot be undone.
    </div>
    <div class="actions">
      <button class="cancel" onclick="closeResetModal()">Cancel</button>
      <button class="confirm" onclick="confirmReset()">Reset</button>
    </div>
  </div>
</div>

<!-- OVERLAY -->
<div id="overlay">
  <div id="overlayHint">Swipe left / right • Tap outside to close</div>
  <img id="overlayImg" alt="">
  <button id="ebayBtn" onclick="searchEbay(event)">🛒 Find on eBay</button>
</div>

<script>
/*
  151 TRACKER v2.0

  Keeps the existing "collection" localStorage structure:
  card-1, card-2, etc.
  Status:
    0 = Needed
    1 = In Post
    2 = Owned

  Card ordering is kept identical to the previous version so
  existing progress remains attached to the same cards.
*/

const API_URL =
  "https://api.pokemontcg.io/v2/cards?q=set.id:sv3pt5&pageSize=250";

const CACHE_KEY = "151Tracker_cardCache_v2";
const CACHE_VERSION = 2;
const API_TIMEOUT = 8000;

let saved = {};
let cards = [];
let currentView = "normal";
let showWishlist = false;
let showInPost = false;
let currentIndex = 0;
let visibleIndices = [];
let loadingRun = 0;

const totals = {
  normal:165,
  poke:165,
  master:165,
  extra:45
};

const names = {
  normal:"Normal",
  poke:"Pokéball",
  master:"Masterball",
  extra:"Extras"
};

function loadSaved() {
  try {
    saved = JSON.parse(localStorage.getItem("collection")) || {};
  } catch {
    saved = {};
  }

  // Small compatibility migration for older boolean-style saves.
  Object.keys(saved).forEach(key => {
    if (!saved[key] || typeof saved[key] !== "object") {
      saved[key] = {normal:0,poke:0,master:0,extra:0};
      return;
    }

    ["normal","poke","master","extra"].forEach(v => {
      if (saved[key][v] === true) saved[key][v] = 2;
      if (saved[key][v] === false || saved[key][v] == null) saved[key][v] = 0;
    });
  });
}

function saveCollection() {
  localStorage.setItem("collection", JSON.stringify(saved));
}

function setLoadingText(text) {
  document.getElementById("loadingText").textContent = text;
}

function setLoadingProgress(value) {
  document.getElementById("loadingFill").style.width =
    Math.max(0, Math.min(100, value)) + "%";
}

function hideSplash() {
  setLoadingProgress(100);
  setLoadingText("Ready!");
  setTimeout(() => {
    document.getElementById("splash").classList.add("hide");
    document.body.classList.remove("loading");
  }, 350);

  if (navigator.vibrate) {
    try { navigator.vibrate(18); } catch {}
  }
}

function showSplashError() {
  document.getElementById("loadingText").textContent =
    "Couldn't connect to the card database";
  document.getElementById("loadingSub").textContent =
    "Your collection data is safe";
  document.getElementById("retryLoad").style.display = "block";
}

function openResetModal() {
  document.getElementById("resetModal").style.display = "flex";
}

function closeResetModal() {
  document.getElementById("resetModal").style.display = "none";
}

function confirmReset() {
  localStorage.removeItem("collection");
  location.reload();
}

function scrollToTop() {
  window.scrollTo({top:0, behavior:"smooth"});
}

function toggleWishlist() {
  showWishlist = !showWishlist;
  if (showWishlist) showInPost = false;
  render();
}

function toggleInPost() {
  showInPost = !showInPost;
  if (showInPost) showWishlist = false;
  render();
}

/* ---------- CARD DATA ---------- */

function makeCard(id, num, name, small, large) {
  return {
    id,
    num,
    data:{
      name,
      images:{
        small:small || "",
        large:large || small || ""
      }
    }
  };
}

function processCards(apiCards) {
  let processed = apiCards.map(c => ({
    id:c.id,
    num:parseInt(c.number) || 0,
    data:{
      name:c.name || "Unknown",
      images:{
        small:c.images?.small || "",
        large:c.images?.large || c.images?.small || ""
      }
    }
  })).sort((a,b)=>a.num-b.num);

  // Preserve the exact special ordering from the previous tracker.
  const fix = [162,159,152,154,153,163,164,155,165,158,160,161,156,157];

  const mid = processed.filter(c => c.num >= 152 && c.num <= 165);
  const reordered = [];

  fix.forEach(n => {
    const found = mid.find(c => c.num === n);
    if (found) reordered.push(found);
  });

  processed = [
    ...processed.filter(c => c.num < 152),
    ...reordered,
    ...processed.filter(c => c.num > 165)
  ];

  let main = processed.filter(c => c.num <= 165);
  let extras = processed.filter(c => c.num > 165).sort((a,b)=>a.num-b.num);

  // Keep the three custom promo images used by the current tracker.
  extras.splice(15,0,makeCard(
    "promo-snorlax",
    0,
    "Snorlax",
    "https://i.postimg.cc/9Qr4BCBh/snorlax.png"
  ));

  extras.splice(17,0,makeCard(
    "promo-mewtwo",
    0,
    "Mewtwo",
    "https://i.postimg.cc/YCh4xMz1/mewtwo.png"
  ));

  extras.splice(39,0,makeCard(
    "promo-mewex",
    0,
    "Mew ex",
    "https://i.postimg.cc/c41trQg1/mew.png"
  ));

  processed = [...main,...extras];

  // Preserve the previous extra-card move exactly.
  let ex = processed.slice(165);
  const moved = ex.splice(30,1)[0];
  if (moved) ex.splice(33,0,moved);

  return [...processed.slice(0,165),...ex];
}

function getCachedCards() {
  try {
    const cache = JSON.parse(localStorage.getItem(CACHE_KEY));
    if (!cache || cache.version !== CACHE_VERSION || !Array.isArray(cache.cards)) {
      return null;
    }
    return cache.cards;
  } catch {
    return null;
  }
}

function cacheCards(cardList) {
  try {
    // Store only the fields the app actually needs.
    const minimal = cardList.map(c => ({
      id:c.id,
      num:c.num,
      data:{
        name:c.data.name,
        images:{
          small:c.data.images.small,
          large:c.data.images.large || c.data.images.small
        }
      }
    }));

    localStorage.setItem(CACHE_KEY, JSON.stringify({
      version:CACHE_VERSION,
      savedAt:Date.now(),
      cards:minimal
    }));
  } catch {
    // Cache is an optimisation, not something the app depends on.
  }
}

async function fetchWithTimeout(url) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), API_TIMEOUT);

  try {
    const response = await fetch(url, {
      signal:controller.signal,
      cache:"no-store"
    });

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    return await response.json();
  } finally {
    clearTimeout(timer);
  }
}

function showCardsImmediately(cached) {
  cards = cached;
  document.getElementById("loadError").style.display = "none";
  setLoadingProgress(70);
  setLoadingText("Opening your collection...");
  render();
}

async function refreshFromApi() {
  try {
    setLoadingText("Checking card database...");
    const data = await fetchWithTimeout(API_URL);

    if (!data || !Array.isArray(data.data) || !data.data.length) {
      throw new Error("No card data");
    }

    const processed = processCards(data.data);

    if (processed.length < 200) {
      throw new Error("Incomplete card data");
    }

    cards = processed;
    cacheCards(cards);
    render();
    return true;
  } catch (error) {
    console.warn("151 Tracker API refresh failed:", error);
    return false;
  }
}

async function startLoading(forceRetry = false) {
  const thisRun = ++loadingRun;

  document.getElementById("retryLoad").style.display = "none";
  document.getElementById("loadError").style.display = "none";
  document.getElementById("splash").classList.remove("hide");
  document.body.classList.add("loading");

  setLoadingProgress(5);
  setLoadingText("Starting 151 Tracker...");
  setTimeout(() => {
    if (thisRun === loadingRun) setLoadingProgress(18);
  }, 80);

  const cached = getCachedCards();

  if (cached && cached.length >= 200) {
    setLoadingProgress(42);
    setLoadingText("Loading saved card list...");
    showCardsImmediately(cached);

    // Don't make the user wait for the network.
    setTimeout(async () => {
      if (thisRun !== loadingRun) return;
      setLoadingProgress(78);
      const refreshed = await refreshFromApi();
      if (thisRun !== loadingRun) return;

      if (refreshed) {
        setLoadingText("Collection updated");
        setLoadingProgress(94);
      } else {
        setLoadingText("Using saved card list");
        setLoadingProgress(94);
      }

      hideSplash();
    }, forceRetry ? 50 : 100);
    return;
  }

  setLoadingProgress(30);
  setLoadingText("Getting card list...");
  const refreshed = await refreshFromApi();

  if (thisRun !== loadingRun) return;

  if (refreshed) {
    setLoadingProgress(90);
    setLoadingText("Organising your cards...");
    render();
    hideSplash();
  } else {
    setLoadingProgress(20);
    showSplashError();
    document.getElementById("loadError").style.display = "block";

    if (cards.length) {
      render();
    }
  }
}

/* ---------- VIEW ---------- */

function setView(v) {
  currentView = v;

  document.querySelectorAll(".tabs button")
    .forEach(b => b.classList.remove("active"));

  document.getElementById("tab-" + v).classList.add("active");

  render();

  window.scrollTo({top:0, behavior:"smooth"});
}

function getCardStatus(key, view) {
  if (!saved[key]) {
    saved[key] = {normal:0,poke:0,master:0,extra:0};
  }

  if (typeof saved[key][view] !== "number") {
    saved[key][view] = 0;
  }

  return saved[key][view];
}

function cardColors() {
  if (currentView === "poke") {
    return {
      owned:"#e53935",
      inPost:"#ef9a9a",
      text:"white"
    };
  }

  if (currentView === "master") {
    return {
      owned:"#8e24aa",
      inPost:"#ce93d8",
      text:"white"
    };
  }

  if (currentView === "extra") {
    return {
      owned:"#1e88e5",
      inPost:"#90caf9",
      text:"white"
    };
  }

  return {
    owned:"#ffffff",
    inPost:"#bdbdbd",
    text:"black"
  };
}

function imageFallback(img) {
  img.classList.remove("loading");
  img.classList.add("failed");
  img.alt = "Image unavailable";
  img.src =
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="420">' +
      '<rect width="100%" height="100%" fill="#111"/>' +
      '<text x="50%" y="48%" fill="#777" text-anchor="middle" font-size="18">Image unavailable</text>' +
      '<text x="50%" y="54%" fill="#555" text-anchor="middle" font-size="13">Tap to try again</text>' +
      '</svg>'
    );
}

function retryCardImage(img, url) {
  if (!url) {
    imageFallback(img);
    return;
  }

  const retryUrl =
    url + (url.includes("?") ? "&" : "?") + "retry=" + Date.now();

  img.src = retryUrl;
}

function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  visibleIndices = [];

  if (!cards.length) {
    document.getElementById("progress").textContent = "Waiting for cards...";
    return;
  }

  let count = 0;
  let totalOwned = 0;
  let wishlistCount = 0;
  let inPostCount = 0;

  // IMPORTANT: Count totals before applying filters.
  cards.forEach((card,index) => {
    const key = "card-" + (index + 1);

    if (!saved[key]) {
      saved[key] = {normal:0,poke:0,master:0,extra:0};
    }

    ["normal","poke","master","extra"].forEach(v => {
      if (getCardStatus(key,v) === 2) totalOwned++;
    });

    const displayNum = index + 1;
    const isExtra = displayNum > 165;

    if (
      (currentView === "extra" && !isExtra) ||
      (currentView !== "extra" && isExtra)
    ) return;

    const status = getCardStatus(key,currentView);

    if (status === 2) count++;
    if (status === 0) wishlistCount++;
    if (status === 1) inPostCount++;
  });

  // Render only the cards that match the selected filter.
  cards.forEach((card,index) => {
    const key = "card-" + (index + 1);
    const displayNum = index + 1;
    const isExtra = displayNum > 165;

    if (
      (currentView === "extra" && !isExtra) ||
      (currentView !== "extra" && isExtra)
    ) return;

    const status = getCardStatus(key,currentView);

    if (showWishlist && status !== 0) return;
    if (showInPost && status !== 1) return;

    visibleIndices.push(index);

    const div = document.createElement("div");
    div.className = "card";

    const title
