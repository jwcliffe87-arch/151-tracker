<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<title>151 Tracker</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#0d0d0d;color:#fff;font-family:Arial,sans-serif}
body{min-height:100vh;padding-bottom:66px}
button{font:inherit;cursor:pointer}
.header{padding:8px;text-align:center;position:relative}
#logo{width:100%;max-width:300px;max-height:82px;object-fit:contain;margin:0 auto 6px;display:block}
#totalText,#progress{font-size:14px;margin:2px 0}
.bar{height:10px;background:#333;border-radius:6px;overflow:hidden;margin-top:6px}
.fill{height:100%;width:0;transition:width .25s ease}
.tabs{display:flex;gap:5px;padding:6px;position:sticky;top:0;background:#0d0d0d;z-index:20}
.tabs button{flex:1;padding:9px 4px;border:0;border-radius:7px;background:#333;color:#fff;font-size:13px}
.tabs button.active{box-shadow:0 0 10px currentColor}
#tab-normal.active{background:#fff;color:#000}
#tab-poke.active{background:#e53935}
#tab-master.active{background:#8e24aa}
#tab-extra.active{background:#1e88e5}
.filter-row{display:flex;gap:6px;padding:0 6px 6px}
.filter-row button{flex:1;padding:8px;border:0;border-radius:7px;background:#444;color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px}
.card{background:#1a1a1a;border-radius:10px;padding:6px;text-align:center;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.card-name{height:40px;font-size:13px;overflow:hidden;display:flex;align-items:center;justify-content:center;line-height:1.15}
.card img{width:100%;height:140px;object-fit:contain;background:#080808;border-radius:6px;margin:3px 0}
.card-btn{margin-top:4px;width:100%;padding:7px 3px;border:0;border-radius:6px;min-height:32px}
.ebay-btn{margin-top:4px;width:100%;padding:6px 2px;border:0;border-radius:6px;background:#f5f5f5;color:#111;font-size:11px}
#backTop{position:fixed;right:18px;bottom:76px;width:48px;height:48px;border:0;border-radius:50%;background:#333;color:#fff;font-size:20px;z-index:50;opacity:.9}
#statsBar{position:fixed;bottom:0;left:0;width:100%;background:#111;color:#ccc;font-size:13px;text-align:center;padding:8px 0;z-index:40;border-top:2px solid #333}
#resetModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:1000;justify-content:center;align-items:center}
#resetModal .box{background:#1a1a1a;padding:20px;border-radius:12px;width:82%;max-width:320px;text-align:center}
.actions{display:flex;gap:10px}.actions button{flex:1;padding:9px;border:0;border-radius:6px}
.cancel{background:#444;color:#fff}.confirm{background:#e53935;color:#fff}
#settingsBtn{position:absolute;top:8px;right:8px;background:#222;color:#fff;border:0;border-radius:50%;width:36px;height:36px;font-size:17px}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:2000;align-items:center;justify-content:center;flex-direction:column}
#overlay img{width:94%;max-width:520px;max-height:78vh;object-fit:contain}
.overlay-title{font-size:15px;margin:8px;text-align:center}
.overlay-actions{display:flex;gap:8px;position:absolute;bottom:26px;left:12px;right:12px;justify-content:center}
.overlay-actions button{padding:10px 14px;border:0;border-radius:8px;background:#333;color:#fff}
#overlayEbay{background:#f5f5f5;color:#111}
#splash{position:fixed;inset:0;background:#050509;z-index:5000;display:flex;align-items:center;justify-content:center;transition:opacity .35s ease}
#splashImg{width:100%;height:100%;object-fit:cover}
#splashFallback{display:none;text-align:center;padding:24px}
#splashFallback h1{font-size:30px;margin:0 0 8px}
#splashFallback p{color:#aaa;margin:0}
#splashBar{position:absolute;left:15%;right:15%;bottom:10%;height:6px;background:#333;border-radius:5px;overflow:hidden}
#splashFill{height:100%;width:0;background:#fff;transition:width .6s ease}
.empty{grid-column:1/-1;text-align:center;color:#aaa;padding:40px 10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(5,1fr)}.card img{height:190px}}
</style>
</head>
<body>

<div id="splash">
  <img id="splashImg" src="splash.png" alt="" onerror="this.style.display='none';document.getElementById('splashFallback').style.display='block'">
  <div id="splashFallback">
    <h1>151 TRACKER</h1>
    <p>Scarlet &amp; Violet 151 Korean Master Set</p>
  </div>
  <div id="splashBar"><div id="splashFill"></div></div>
</div>

<div class="header">
  <img src="logo.png" id="logo" alt="151 Tracker" onerror="this.style.display='none'">
  <div id="totalText"></div>
  <div id="progress"></div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <button id="settingsBtn" onclick="openResetModal()" aria-label="Settings">⚙️</button>
</div>

<div class="tabs">
  <button id="tab-normal" onclick="setView('normal')">Normal</button>
  <button id="tab-poke" onclick="setView('poke')">Pokéball</button>
  <button id="tab-master" onclick="setView('master')">Masterball</button>
  <button id="tab-extra" onclick="setView('extra')">Extras</button>
</div>

<div class="filter-row">
  <button id="wishlistToggle" onclick="toggleWishlist()">Show Wishlist</button>
  <button id="inPostToggle" onclick="toggleInPost()">Show In Post</button>
</div>

<div class="grid" id="grid"></div>
<button id="backTop" onclick="scrollToTop()">↑</button>
<div id="statsBar"><span id="statsText"></span></div>

<div id="resetModal">
  <div class="box">
    <div style="font-size:18px;margin-bottom:10px">⚙️ Reset Progress</div>
    <div style="font-size:14px;color:#ccc;margin-bottom:20px">
      This will clear your entire collection.<br><br>This cannot be undone.
    </div>
    <div class="actions">
      <button class="cancel" onclick="closeResetModal()">Cancel</button>
      <button class="confirm" onclick="confirmReset()">Reset</button>
    </div>
  </div>
</div>

<div id="overlay">
  <div class="overlay-title" id="overlayTitle"></div>
  <img id="overlayImg" alt="">
  <div class="overlay-actions">
    <button onclick="closeOverlay()">Close</button>
    <button id="overlayEbay" onclick="findOnEbay()">🛒 Find on eBay</button>
  </div>
</div>

const totals = {normal:165,poke:165,master:165,extra:45};
const names = {normal:"Normal",poke:"Pokéball",master:"Masterball",extra:"Extras"};

let saved = {};
try {
  saved = JSON.parse(localStorage.getItem("collection") || "{}") || {};
} catch(e) {
  saved = {};
}

let cards = CARD_DATA.slice();
let currentView = "normal";
let showWishlist = false;
let showInPost = false;
let visibleCards = [];
let currentVisibleIndex = 0;
let touchStartX = 0;

function ensureSaved(key) {
  if(!saved[key]) saved[key] = {normal:0,poke:0,master:0,extra:0};
  if(typeof saved[key].normal !== "number") saved[key].normal=0;
  if(typeof saved[key].poke !== "number") saved[key].poke=0;
  if(typeof saved[key].master !== "number") saved[key].master=0;
  if(typeof saved[key].extra !== "number") saved[key].extra=0;
}

function persist() {
  localStorage.setItem("collection",JSON.stringify(saved));
}

function openResetModal() {
  document.getElementById("resetModal").style.display="flex";
}
function closeResetModal() {
  document.getElementById("resetModal").style.display="none";
}
function confirmReset() {
  localStorage.removeItem("collection");
  location.reload();
}
function scrollToTop() {
  window.scrollTo({top:0,behavior:"smooth"});
}

function toggleWishlist() {
  showWishlist=!showWishlist;
  if(showWishlist) showInPost=false;
  render();
}
function toggleInPost() {
  showInPost=!showInPost;
  if(showInPost) showWishlist=false;
  render();
}

function colourForView() {
  if(currentView==="poke") return "#e53935";
  if(currentView==="master") return "#8e24aa";
  if(currentView==="extra") return "#1e88e5";
  return "#fff";
}
function textColourForView() {
  return currentView==="normal" ? "#000" : "#fff";
}

function setView(v) {
  currentView=v;
  showWishlist=false;
  showInPost=false;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
  document.getElementById("tab-"+v).classList.add("active");
  render();
}

function ebayUrl(card) {
  const q = "Pokemon 151 Korean " + card.name;
  return "https://www.ebay.co.uk/sch/i.html?_nkw="+encodeURIComponent(q);
}

function findOnEbay() {
  const card = visibleCards[currentVisibleIndex];
  if(!card) return;
  window.open(ebayUrl(card),"_blank");
}

function closeOverlay() {
  document.getElementById("overlay").style.display="none";
}

function openOverlay(cardIndex) {
  const pos=visibleCards.findIndex(x=>x.index===cardIndex);
  if(pos<0) return;
  currentVisibleIndex=pos;
  updateOverlay();
  document.getElementById("overlay").style.display="flex";
}

function updateOverlay() {
  const card=visibleCards[currentVisibleIndex];
  if(!card) return;
  document.getElementById("overlayImg").src=card.data.img;
  document.getElementById("overlayTitle").textContent="#"+(card.index+1)+" "+card.data.name;
  const key="card-"+(card.index+1);
  ensureSaved(key);
  document.getElementById("overlayEbay").style.display =
    saved[key][currentView]===0 ? "inline-block" : "none";
}

document.getElementById("overlay").addEventListener("click",function(e){
  if(e.target===this) closeOverlay();
});
document.getElementById("overlayImg").addEventListener("click",function(e){
  e.stopPropagation();
});
document.getElementById("overlay").addEventListener("touchstart",function(e){
  if(e.touches && e.touches[0]) touchStartX=e.touches[0].clientX;
},{passive:true});
document.getElementById("overlay").addEventListener("touchend",function(e){
  if(!e.changedTouches || !e.changedTouches[0]) return;
  const endX=e.changedTouches[0].clientX;
  const diff=endX-touchStartX;
  if(Math.abs(diff)>50) {
    if(diff<0 && currentVisibleIndex<visibleCards.length-1) currentVisibleIndex++;
    if(diff>0 && currentVisibleIndex>0) currentVisibleIndex--;
    updateOverlay();
  }
},{passive:true});

function render() {
  const grid=document.getElementById("grid");
  grid.innerHTML="";
  visibleCards=[];

  let tabOwned=0;
  let tabNeeded=0;
  let tabInPost=0;
  let totalOwned=0;

  for(let i=0;i<cards.length;i++) {
    const key="card-"+(i+1);
    ensureSaved(key);
    for(const v of ["normal","poke","master","extra"]) {
      if(saved[key][v]===2) totalOwned++;
    }
  }

  const isExtraView=currentView==="extra";

  for(let i=0;i<cards.length;i++) {
    const card=cards[i];
    const isExtra=i>=165;
    if(isExtra!==isExtraView) continue;

    const key="card-"+(i+1);
    ensureSaved(key);
    const status=saved[key][currentView];

    if(status===2) tabOwned++;
    if(status===0) tabNeeded++;
    if(status===1) tabInPost++;

    if(showWishlist && status!==0) continue;
    if(showInPost && status!==1) continue;

    visibleCards.push({data:card,index:i});

    const div=document.createElement("div");
    div.className="card";

    const title=document.createElement("div");
    title.className="card-name";
    title.textContent="#"+(i+1)+" "+card.name;
    div.appendChild(title);

    const img=document.createElement("img");
    img.loading="lazy";
    img.alt=card.name;
    img.src=card.img;
    img.onerror=function(){
      this.style.opacity=".35";
      this.alt="Image unavailable";
    };
    img.onclick=function(){openOverlay(i)};
    div.appendChild(img);

    const btn=document.createElement("button");
    btn.className="card-btn";

    let ownedColor=colourForView();
    let inPostColor="#bdbdbd";
    let buttonTextColor=currentView==="normal" ? "#000" : "#fff";

    if(currentView==="poke") inPostColor="#ef9a9a";
    if(currentView==="master") inPostColor="#ce93d8";
    if(currentView==="extra") inPostColor="#90caf9";

    if(status===0) {
      btn.textContent="Needed";
      btn.style.background="#444";
      btn.style.color="#fff";
    } else if(status===1) {
      btn.textContent="✉️ In Post";
      btn.style.background=inPostColor;
      btn.style.color=buttonTextColor;
    } else {
      btn.textContent="✔";
      btn.style.background=ownedColor;
      btn.style.color=buttonTextColor;
    }

    btn.onclick=function(){
      if(saved[key][currentView]===0) saved[key][currentView]=1;
      else if(saved[key][currentView]===1) saved[key][currentView]=2;
      else saved[key][currentView]=0;
      persist();
      render();
    };
    div.appendChild(btn);

    if(status===0) {
      const eb=document.createElement("button");
      eb.className="ebay-btn";
      eb.textContent="🛒 Find on eBay";
      eb.onclick=function(){window.open(ebayUrl(card),"_blank")};
      div.appendChild(eb);
    }

    grid.appendChild(div);
  }

  if(visibleCards.length===0) {
    const empty=document.createElement("div");
    empty.className="empty";
    empty.textContent=showWishlist ? "Wishlist is empty 🎉" : "Nothing in this filter yet.";
    grid.appendChild(empty);
  }

  const needed=totals[currentView]-tabOwned;
  const percent=Math.round((tabOwned/totals[currentView])*100);
  const barColor=colourForView();

  document.getElementById("progress").textContent =
    names[currentView]+" "+tabOwned+" / "+totals[currentView]+" ("+needed+" needed)";
  document.getElementById("totalText").textContent =
    "Total "+totalOwned+" / 540 ("+(540-totalOwned)+" needed)";
  document.getElementById("fill").style.width=Math.min(100,percent)+"%";
  document.getElementById("fill").style.background=barColor;
  document.getElementById("statsText").textContent =
    percent+"% Complete • "+needed+" Needed • "+tabOwned+" Collected • "+tabInPost+" In Post";
  document.getElementById("statsBar").style.borderTop="2px solid "+barColor;

  const wish=document.getElementById("wishlistToggle");
  const post=document.getElementById("inPostToggle");
  wish.textContent=showWishlist ? "Showing Wishlist ("+tabNeeded+")" : "Show Wishlist ("+tabNeeded+")";
  post.textContent=showInPost ? "Showing In Post ("+tabInPost+")" : "Show In Post ("+tabInPost+")";
  wish.style.background=showWishlist ? barColor : "#444";
  wish.style.color=showWishlist ? textColourForView() : "#fff";
  post.style.background=showInPost ? barColor : "#444";
  post.style.color=showInPost ? textColourForView() : "#fff";
}

document.getElementById("tab-normal").classList.add("active");
render();

let splashProgress=0;
const splashFill=document.getElementById("splashFill");
const splash=document.getElementById("splash");
const splashTimer=setInterval(function(){
  splashProgress=Math.min(100,splashProgress+20);
  splashFill.style.width=splashProgress+"%";
  if(splashProgress>=100){
    clearInterval(splashTimer);
    setTimeout(function(){
      splash.style.opacity="0";
      setTimeout(function(){splash.style.display="none"},350);
    },180);
  }
},120);

setTimeout(function(){
  splash.style.opacity="0";
  splash.style.display="none";
},1800);
</script>
