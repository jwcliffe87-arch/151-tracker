<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>151 Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0d0d">
<link rel="manifest" href="manifest.json">

<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#0d0d0d;color:#fff;margin:0;min-height:100vh}
body.loading{overflow:hidden}

/* SPLASH */
#splash{
  position:fixed;inset:0;background:#050505;z-index:5000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px;transition:opacity .4s ease,visibility .4s ease
}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#splashImage{
  width:min(88vw,420px);max-height:60vh;object-fit:contain;
  border-radius:18px;display:block
}
#splashFallback{
  display:none;width:150px;height:150px;border-radius:30px;
  align-items:center;justify-content:center;font-size:70px;background:#1a1a1a
}
#loadingText{margin-top:18px;min-height:20px;color:#ccc;font-size:14px;text-align:center}
#loadingTrack{width:min(78vw,330px);height:8px;margin-top:12px;background:#292929;border-radius:99px;overflow:hidden}
#loadingFill{width:4%;height:100%;background:#fff;border-radius:99px;transition:width .3s ease}
#loadingSub{margin-top:9px;color:#777;font-size:11px}
#retryLoad{
  display:none;margin-top:15px;padding:9px 18px;border:0;border-radius:8px;
  background:#444;color:#fff
}

/* MAIN APP */
.header{padding:8px;text-align:center;position:relative}
#logo{width:100%;max-width:300px;margin:0 auto 10px;display:block}
.bar{height:10px;background:#333;border-radius:6px;overflow:hidden}
.fill{height:100%;width:0%;transition:width .3s ease}
.tabs{display:flex;gap:5px;padding:6px}
.tabs button{
  flex:1;padding:8px 4px;border:0;border-radius:6px;background:#333;color:#fff;
  transition:transform .1s ease,box-shadow .2s ease
}
.tabs button:active,#filterButtons button:active,button.card-btn:active{transform:scale(.97)}
.tabs button.active{box-shadow:0 0 10px currentColor}
#tab-normal.active{background:#fff;color:#000}
#tab-poke.active{background:#e53935}
#tab-master.active{background:#8e24aa}
#tab-extra.active{background:#1e88e5}

#filterButtons{display:flex;gap:6px;padding:0 6px}
#wishlistToggle,#inPostToggle{
  flex:1;padding:8px 4px;border:0;border-radius:6px;background:#444;color:#fff;
  transition:transform .1s ease,box-shadow .2s ease
}

.grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
  padding:6px 6px 60px
}
.card{
  background:#1a1a1a;border-radius:10px;padding:6px;text-align:center;
  display:flex;flex-direction:column;justify-content:space-between;min-width:0
}
.card-title{height:48px;font-size:14px;overflow:hidden}
.card img{
  width:100%;height:140px;object-fit:contain;background:#080808;
  border-radius:6px;display:block;cursor:pointer
}
.card img.loading{
  background:linear-gradient(90deg,#111 25%,#202020 50%,#111 75%);
  background-size:200% 100%;animation:shimmer 1.2s infinite
}
@keyframes shimmer{to{background-position:-200% 0}}
button.card-btn{
  margin-top:4px;width:100%;padding:7px 6px;border:0;border-radius:6px;
  transition:transform .1s ease,filter .15s ease
}
.reset-icon{
  position:absolute;top:10px;right:10px;background:#222;color:#fff;border:0;
  border-radius:50%;width:36px;height:36px;font-size:18px
}
#backTop{
  position:fixed;bottom:70px;right:20px;width:50px;height:50px;border:0;
  border-radius:50%;background:#333;color:#fff;font-size:20px;
  display:flex;align-items:center;justify-content:center;z-index:999;opacity:.8
}
#statsBar{
  position:fixed;bottom:0;left:0;width:100%;background:#111;color:#ccc;
  font-size:13px;text-align:center;padding:8px 0;z-index:998;border-top:2px solid #333
}
#loadError{
  display:none;margin:12px 6px;padding:14px;background:#1a1a1a;
  border-radius:10px;text-align:center;color:#ccc
}
#loadError button{margin-top:10px;padding:8px 14px;border:0;border-radius:7px;background:#444;color:#fff}

/* RESET */
#resetModal{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:3000;
  justify-content:center;align-items:center
}
#resetModal .box{
  background:#1a1a1a;padding:20px;border-radius:12px;width:80%;
  max-width:300px;text-align:center
}
#resetModal .actions{display:flex;gap:10px}
#resetModal button{flex:1;padding:8px;border:0;border-radius:6px}
.cancel{background:#444;color:#fff}
.confirm{background:#e53935;color:#fff}

/* CARD VIEWER */
#overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.96);
  justify-content:center;align-items:center;z-index:4000;touch-action:pan-y
}
#overlayImg{width:95%;max-height:88%;object-fit:contain;border-radius:8px}
#ebayBtn{
  position:absolute;bottom:30px;left:50%;transform:translateX(-50%);
  padding:10px 16px;border:0;border-radius:8px;background:#333;color:#fff;
  font-size:14px;z-index:4001;display:none
}
#overlayHint{
  position:absolute;top:18px;left:50%;transform:translateX(-50%);
  color:#777;font-size:11px;pointer-events:none;white-space:nowrap
}
</style>
</head>

<body class="loading">

<div id="splash">
  <img src="splash.png" id="splashImage" alt="151 Tracker loading">
  <div id="splashFallback">🃏</div>
  <div id="loadingText">Starting 151 Tracker...</div>
  <div id="loadingTrack"><div id="loadingFill"></div></div>
  <div id="loadingSub">Preparing your collection</div>
  <button id="retryLoad" onclick="startApp(true)">Retry</button>
</div>

<div class="header">
  <img src="logo.png" id="logo" alt="151 Tracker">
  <div id="totalText"></div>
  <div id="progress"></div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <button class="reset-icon" onclick="openResetModal()" aria-label="Settings">⚙️</button>
</div>

<div class="tabs">
  <button id="tab-normal" onclick="setView('normal')">Normal</button>
  <button id="tab-poke" onclick="setView('poke')">Pokéball</button>
  <button id="tab-master" onclick="setView('master')">Masterball</button>
  <button id="tab-extra" onclick="setView('extra')">Extras</button>
</div>

<div id="filterButtons">
  <button id="wishlistToggle" onclick="toggleWishlist()">Show Wishlist</button>
  <button id="inPostToggle" onclick="toggleInPost()">Show In Post</button>
</div>

<div id="loadError">
  Couldn't load the card list.<br>
  Your saved collection is safe.<br>
  <button onclick="startApp(true)">Try Again</button>
</div>

<div class="grid" id="grid"></div>

<button id="backTop" onclick="scrollToTop()">↑</button>

<div id="statsBar"><span id="statsText"></span></div>

<div id="resetModal">
  <div class="box">
    <div style="font-size:18px;margin-bottom:10px">⚙️ Reset Progress</div>
    <div style="font-size:14px;color:#ccc;margin-bottom:20px">
      This will clear your entire collection.<br><br>
      This cannot be undone.
    </div>
    <div class="actions">
      <button class="cancel" onclick="closeResetModal()">Cancel</button>
      <button class="confirm" onclick="confirmReset()">Reset</button>
    </div>
  </div>
</div>

<div id="overlay">
  <div id="overlayHint">Swipe left / right • Tap outside to close</div>
  <img id="overlayImg" alt="">
  <button id="ebayBtn" onclick="searchEbay(event)">🛒 Find on eBay</button>
</div>

<script>
/*
  151 TRACKER v2.0.1
  Existing collection storage is preserved:
  card-1, card-2, etc.
  0 = Needed, 1 = In Post, 2 = Owned
*/

var API_URL = "https://api.pokemontcg.io/v2/cards?q=set.id:sv3pt5&pageSize=250";
var CACHE_KEY = "151Tracker_cardCache_v2";
var CACHE_VERSION = 2;
var API_TIMEOUT = 8000;

var saved = {};
var cards = [];
var currentView = "normal";
var showWishlist = false;
var showInPost = false;
var currentIndex = 0;
var visibleIndices = [];
var loadingRun = 0;

var totals = {normal:165,poke:165,master:165,extra:45};
var names = {normal:"Normal",poke:"Pokéball",master:"Masterball",extra:"Extras"};

function byId(id){ return document.getElementById(id); }

function loadSaved(){
  try{
    saved = JSON.parse(localStorage.getItem("collection")) || {};
  }catch(e){
    saved = {};
  }

  Object.keys(saved).forEach(function(key){
    if(!saved[key] || typeof saved[key] !== "object"){
      saved[key]={normal:0,poke:0,master:0,extra:0};
      return;
    }
    ["normal","poke","master","extra"].forEach(function(v){
      if(saved[key][v] === true) saved[key][v]=2;
      if(saved[key][v] === false || typeof saved[key][v] !== "number") saved[key][v]=0;
    });
  });
}

function saveCollection(){
  try{ localStorage.setItem("collection",JSON.stringify(saved)); }catch(e){}
}

function setLoadingText(text){ byId("loadingText").textContent=text; }

function setLoadingProgress(value){
  byId("loadingFill").style.width=Math.max(0,Math.min(100,value))+"%";
}

function hideSplash(){
  setLoadingProgress(100);
  setLoadingText("Ready!");
  setTimeout(function(){
    byId("splash").classList.add("hide");
    document.body.classList.remove("loading");
  },300);
  try{
    if(navigator.vibrate) navigator.vibrate(18);
  }catch(e){}
}

function showSplashError(){
  setLoadingText("Card database unavailable");
  byId("loadingSub").textContent="Your collection is safe";
  byId("retryLoad").style.display="block";
  byId("loadError").style.display="block";
}

function openResetModal(){ byId("resetModal").style.display="flex"; }
function closeResetModal(){ byId("resetModal").style.display="none"; }

function confirmReset(){
  localStorage.removeItem("collection");
  location.reload();
}

function scrollToTop(){
  window.scrollTo({top:0,behavior:"smooth"});
}

function toggleWishlist(){
  showWishlist=!showWishlist;
  if(showWishlist) showInPost=false;
  render();
}

function toggleInPost(){
  showInPost=!showInPost;
  if(showInPost) showWishlist=false;
  render();
}

function getStatus(key,view){
  if(!saved[key]) saved[key]={normal:0,poke:0,master:0,extra:0};
  if(typeof saved[key][view] !== "number") saved[key][view]=0;
  return saved[key][view];
}

/* Build the exact card order used by the existing tracker. */
function processCards(apiCards){
  var processed=apiCards.map(function(c){
    return {
      id:c.id,
      num:parseInt(c.number,10)||0,
      data:{
        name:c.name||"Unknown",
        images:{
          small:(c.images && c.images.small)||"",
          large:(c.images && (c.images.large||c.images.small))||""
        }
      }
    };
  }).sort(function(a,b){return a.num-b.num;});

  var fix=[162,159,152,154,153,163,164,155,165,158,160,161,156,157];
  var mid=processed.filter(function(c){return c.num>=152&&c.num<=165;});
  var reordered=[];

  fix.forEach(function(n){
    var found=mid.find(function(c){return c.num===n;});
    if(found) reordered.push(found);
  });

  processed=processed.filter(function(c){return c.num<152;})
    .concat(reordered)
    .concat(processed.filter(function(c){return c.num>165;}));

  var main=processed.filter(function(c){return c.num<=165;});
  var extras=processed.filter(function(c){return c.num>165;})
    .sort(function(a,b){return a.num-b.num;});

  extras.splice(15,0,{
    id:"promo-snorlax",num:0,
    data:{name:"Snorlax",images:{
      small:"https://i.postimg.cc/9Qr4BCBh/snorlax.png",
      large:"https://i.postimg.cc/9Qr4BCBh/snorlax.png"
    }}
  });

  extras.splice(17,0,{
    id:"promo-mewtwo",num:0,
    data:{name:"Mewtwo",images:{
      small:"https://i.postimg.cc/YCh4xMz1/mewtwo.png",
      large:"https://i.postimg.cc/YCh4xMz1/mewtwo.png"
    }}
  });

  extras.splice(39,0,{
    id:"promo-mewex",num:0,
    data:{name:"Mew ex",images:{
      small:"https://i.postimg.cc/c41trQg1/mew.png",
      large:"https://i.postimg.cc/c41trQg1/mew.png"
    }}
  });

  processed=main.concat(extras);

  var ex=processed.slice(165);
  var moved=ex.splice(30,1)[0];
  if(moved) ex.splice(33,0,moved);

  return processed.slice(0,165).concat(ex);
}

function getCache(){
  try{
    var cache=JSON.parse(localStorage.getItem(CACHE_KEY));
    if(cache && cache.version===CACHE_VERSION && Array.isArray(cache.cards) && cache.cards.length>=200){
      return cache.cards;
    }
  }catch(e){}
  return null;
}

function saveCache(list){
  try{
    localStorage.setItem(CACHE_KEY,JSON.stringify({
      version:CACHE_VERSION,
      savedAt:Date.now(),
      cards:list.map(function(c){
        return {
          id:c.id,
          num:c.num,
          data:{
            name:c.data.name,
            images:{
              small:c.data.images.small,
              large:c.data.images.large||c.data.images.small
            }
          }
        };
      })
    }));
  }catch(e){}
}

function fetchWithTimeout(url){
  return new Promise(function(resolve,reject){
    var finished=false;
    var controller=window.AbortController ? new AbortController() : null;

    var timer=setTimeout(function(){
      if(finished) return;
      finished=true;
      if(controller) controller.abort();
      reject(new Error("Timeout"));
    },API_TIMEOUT);

    var options={};
    if(controller) options.signal=controller.signal;

    fetch(url,options).then(function(response){
      if(!response.ok) throw new Error("HTTP "+response.status);
      return response.json();
    }).then(function(data){
      if(finished) return;
      finished=true;
      clearTimeout(timer);
      resolve(data);
    }).catch(function(error){
      if(finished) return;
      finished=true;
      clearTimeout(timer);
      reject(error);
    });
  });
}

function setView(v){
  currentView=v;
  document.querySelectorAll(".tabs button").forEach(function(b){
    b.classList.remove("active");
  });
  byId("tab-"+v).classList.add("active");
  render();
}

function render(){
  var grid=byId("grid");
  grid.innerHTML="";
  visibleIndices=[];

  if(!cards.length){
    byId("progress").textContent="Waiting for cards...";
    return;
  }

  var count=0;
  var totalOwned=0;
  var wishlistCount=0;
  var inPostCount=0;

  /* Count BEFORE filters are applied. */
  cards.forEach(function(card,index){
    var key="card-"+(index+1);
    if(!saved[key]) saved[key]={normal:0,poke:0,master:0,extra:0};

    ["normal","poke","master","extra"].forEach(function(v){
      if(getStatus(key,v)===2) totalOwned++;
    });

    var displayNum=index+1;
    var isExtra=displayNum>165;

    if((currentView==="extra"&&!isExtra)||(currentView!=="extra"&&isExtra)) return;

    var status=getStatus(key,currentView);
    if(status===2) count++;
    if(status===0) wishlistCount++;
    if(status===1) inPostCount++;
  });

  cards.forEach(function(card,index){
    var key="card-"+(index+1);
    var displayNum=index+1;
    var isExtra=displayNum>165;

    if((currentView==="extra"&&!isExtra)||(currentView!=="extra"&&isExtra)) return;

    var status=getStatus(key,currentView);

    if(showWishlist && status!==0) return;
    if(showInPost && status!==1) return;

    visibleIndices.push(index);

    var div=document.createElement("div");
    div.className="card";

    var title=document.createElement("div");
    title.className="card-title";
    title.textContent="#"+displayNum+" "+card.data.name;
    div.appendChild(title);

    var img=document.createElement("img");
    img.className="loading";
    img.loading="lazy";
    img.decoding="async";
    img.alt=card.data.name;
    img.src=card.data.images.small||card.data.images.large||"";

    img.onload=function(){img.classList.remove("loading");};
    img.onerror=function(){
      if(!img.dataset.retry){
        img.dataset.retry="1";
        var u=card.data.images.small||card.data.images.large;
        if(u) img.src=u+(u.indexOf("?")>=0?"&":"?")+"retry="+Date.now();
      }else{
        img.classList.remove("loading");
        img.alt="Image unavailable";
      }
    };
    img.onclick=function(){openOverlay(index);};
    div.appendChild(img);

    var btn=document.createElement("button");
    btn.className="card-btn";

    var owned="#fff",inPost="#bdbdbd",text="black";
    if(currentView==="poke"){owned="#e53935";inPost="#ef9a9a";text="white";}
    if(currentView==="master"){owned="#8e24aa";inPost="#ce93d8";text="white";}
    if(currentView==="extra"){owned="#1e88e5";inPost="#90caf9";text="white";}

    if(status===0){
      btn.textContent="Needed";
      btn.style.background="#444";
      btn.style.color="white";
    }else if(status===1){
      btn.textContent="✉️";
      btn.style.background=inPost;
      btn.style.color=text;
    }else{
      btn.textContent="✔";
      btn.style.background=owned;
      btn.style.color=text;
    }

    btn.onclick=function(){
      if(status===0) saved[key][currentView]=1;
      else if(status===1) saved[key][currentView]=2;
      else saved[key][currentView]=0;

      saveCollection();
      try{if(navigator.vibrate) navigator.vibrate(12);}catch(e){}
      render();
    };

    div.appendChild(btn);
    grid.appendChild(div);
  });

  var neededTab=Math.max(0,totals[currentView]-count);
  var neededTotal=Math.max(0,540-totalOwned);

  byId("progress").textContent=
    names[currentView]+" "+count+" / "+totals[currentView]+" ("+neededTab+" needed)";

  byId("totalText").textContent=
    "Total "+totalOwned+" / 540 ("+neededTotal+" needed)";

  var barColor="#fff";
  if(currentView==="poke") barColor="#e53935";
  if(currentView==="master") barColor="#8e24aa";
  if(currentView==="extra") barColor="#1e88e5";

  byId("fill").style.width=Math.min(100,count/totals[currentView]*100)+"%";
  byId("fill").style.background=barColor;

  var percent=Math.round(count/totals[currentView]*100);
  byId("statsText").textContent=
    percent+"% Complete • "+neededTab+" Needed • "+count+" Collected";
  byId("statsBar").style.borderTop="2px solid "+barColor;

  var textColor=currentView==="normal"?"black":"white";
  var wish=byId("wishlistToggle");
  var post=byId("inPostToggle");

  wish.textContent=showWishlist
    ?"Showing Wishlist ("+wishlistCount+")"
    :"Show Wishlist ("+wishlistCount+")";

  post.textContent=showInPost
    ?"Showing In Post ("+inPostCount+")"
    :"Show In Post ("+inPostCount+")";

  wish.style.background=showWishlist?barColor:"#444";
  wish.style.color=showWishlist?textColor:"white";
  wish.style.boxShadow=showWishlist?"0 0 10px "+barColor:"none";

  post.style.background=showInPost?barColor:"#444";
  post.style.color=showInPost?textColor:"white";
  post.style.boxShadow=showInPost?"0 0 10px "+barColor:"none";
}

/* CARD VIEWER */
function openOverlay(index){
  currentIndex=index;
  byId("overlay").style.display="flex";
  updateOverlay();
}

function updateOverlay(){
  if(!cards[currentIndex]) return;

  var card=cards[currentIndex];
  var img=byId("overlayImg");
  img.classList.add("loading");
  img.dataset.retry="";
  img.src=card.data.images.large||card.data.images.small||"";

  img.onload=function(){img.classList.remove("loading");};
  img.onerror=function(){
    if(!img.dataset.retry){
      img.dataset.retry="1";
      var u=card.data.images.small||card.data.images.large;
      if(u) img.src=u+(u.indexOf("?")>=0?"&":"?")+"retry="+Date.now();
    }
  };

  var key="card-"+(currentIndex+1);
  byId("ebayBtn").style.display=getStatus(key,currentView)===0?"block":"none";
}

function closeOverlay(){
  byId("overlay").style.display="none";
}

byId("overlay").addEventListener("click",function(e){
  if(e.target===byId("overlay")) closeOverlay();
});

byId("overlayImg").addEventListener("click",function(e){
  e.stopPropagation();
});

var startX=0,startY=0;

byId("overlay").addEventListener("touchstart",function(e){
  if(!e.touches.length)return;
  startX=e.touches[0].clientX;
  startY=e.touches[0].clientY;
},{passive:true});

byId("overlay").addEventListener("touchend",function(e){
  if(!e.changedTouches.length)return;

  var endX=e.changedTouches[0].clientX;
  var endY=e.changedTouches[0].clientY;
  var dx=endX-startX;
  var dy=endY-startY;

  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)){
    var pos=visibleIndices.indexOf(currentIndex);

    if(pos>=0){
      if(dx<0 && pos<visibleIndices.length-1){
        currentIndex=visibleIndices[pos+1];
        updateOverlay();
      }
      if(dx>0 && pos>0){
        currentIndex=visibleIndices[pos-1];
        updateOverlay();
      }
    }
  }
},{passive:true});

function searchEbay(e){
  if(e)e.stopPropagation();
  if(!cards[currentIndex])return;

  var key="card-"+(currentIndex+1);
  if(getStatus(key,currentView)!==0)return;

  var card=cards[currentIndex];
  var search="Pokemon Korean 151 "+card.data.name+" "+(currentIndex+1);

  if(currentView==="poke")search+=" Pokeball";
  if(currentView==="master")search+=" Masterball";
  if(currentView==="extra")search+=" Promo";

  window.open(
    "https://www.ebay.co.uk/sch/i.html?_nkw="+encodeURIComponent(search),
    "_blank"
  );
}

/*
  SAFETY NET:
  If anything unexpected prevents the normal loader from finishing,
  the splash will not remain forever.
*/
function emergencyUnlock(){
  if(document.body.classList.contains("loading") && cards.length){
    render();
    hideSplash();
  }
}

/* MAIN STARTUP */
function startApp(forceRetry){
  loadingRun++;
  var thisRun=loadingRun;

  byId("retryLoad").style.display="none";
  byId("loadError").style.display="none";
  byId("splash").classList.remove("hide");
  document.body.classList.add("loading");

  setLoadingProgress(8);
  setLoadingText("Starting 151 Tracker...");
  byId("loadingSub").textContent="Preparing your collection";

  loadSaved();

  var cached=getCache();

  if(cached){
    cards=cached;
    setLoadingProgress(45);
    setLoadingText("Loading saved card list...");
    render();

    /* Hide the splash quickly. API refresh happens afterwards. */
    setTimeout(function(){
      if(thisRun!==loadingRun)return;
      setLoadingProgress(75);
      hideSplash();

      refreshCards(thisRun);
    },350);

    return;
  }

  setLoadingProgress(25);
  setLoadingText("Getting card list...");

  refreshCards(thisRun).then(function(ok){
    if(thisRun!==loadingRun)return;

    if(ok){
      setLoadingProgress(92);
      setLoadingText("Organising your collection...");
      render();
      hideSplash();
    }else{
      showSplashError();
    }
  });
}

function refreshCards(runId){
  return fetchWithTimeout(API_URL).then(function(data){
    if(runId!==loadingRun)return false;
    if(!data || !Array.isArray(data.data) || !data.data.length)throw new Error("No data");

    var processed=processCards(data.data);
    if(processed.length<200)throw new Error("Incomplete data");

    cards=processed;
    saveCache(cards);
    render();
    return true;
  }).catch(function(error){
    console.log("151 Tracker database refresh failed:",error);
    return false;
  });
}

/* Make sure the app can never be permanently trapped on the splash. */
setTimeout(emergencyUnlock,10000);

loadSaved();
setView("normal");

byId("splashImage").addEventListener("error",function(){
  byId("splashImage").style.display="none";
  byId("splashFallback").style.display="flex";
});

startApp(false);
</script>
